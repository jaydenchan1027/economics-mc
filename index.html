<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09131c" />
  <meta name="description" content="Offline Economics MC practice by topic, with instant marking and saved progress." />
  <title>ECON • MC Practice Bank</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="brand" class="brand plain" aria-label="Go home"><span class="brand-symbol">E<span class="symbol-mark">.</span></span><span class="brand-copy">ECON<span class="brand-sub">MC PRACTICE</span></span></button>
    <div class="top-actions"><span id="offlineStatus" class="offline-tag" role="status"><i></i> ONLINE ACCESS</span><button id="settingsBtn" class="icon-button" title="Progress settings" aria-label="Progress settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 3v8M15 13v8"/></svg></button></div>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
  <footer class="app-footer"><p>HKCEE & HKALE past-paper questions · Topics 1–9.</p><p>Answers checked against the source answer keys. Your progress stays on this device.</p></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden />


<script src="data.js" defer></script>
<script src="app.js" defer></script>
<script src="shared-fix.js" defer></script>
<script src="offline.js" defer></script>
</body>
</html>
