<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09131c"><title>ECON • MC Practice Bank</title>
<style>
html,body{margin:0;min-height:100%;background:#09131c;color:#e3eff0;font:15px system-ui}
#startup{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center}
#startup strong{display:block;font-size:1.05rem}
#startup p{font-size:0.85rem;color:#a4b8c0}
#startup a{display:block;margin-top:20px;color:#8bd2cc}
</style></head><body>
<div id="startup" role="status" aria-live="polite"><div>
<strong>Loading Economics MC Question Bank…</strong>
<p>Preparing all 1,336 questions for Topics 1–9.</p>
<a href="original.html">Open the previous working version (Topics 3–9)</a>
</div></div>
<script>
(async function bootstrap() {
  'use strict';
  const fallback=document.querySelector('#startup');
  const fail=message=>{if(!fallback)return;fallback.querySelector('strong').textContent='The question bank could not be loaded.';fallback.querySelector('p').textContent=message};
  const abort=new AbortController();
  const deadline=setTimeout(()=>abort.abort(),30000);
  try {
    const r=await fetch('original.html',{signal:abort.signal});
    if(!r.ok)throw new Error('Website file not found ('+r.status+')');
    let content=await r.text();
    const marker='/* ECON — responsive, offline, zero-dependency multiple-choice practice. */';
    if(!content.includes(marker))throw new Error('An app update changed the startup integration point');
    const tags='<'+'/script>'+Array.from({length:17},(_,i)=>'<script src="econ12_part_'+String(i+1).padStart(2,'0')+'.js"></'+'script>').join('')+'<script src="econ12_finalize.js"></'+'script><script>';
    content=content.replace(marker,tags+marker);
    content=content.replace('for(const topic of [3,4,5,6,7,8,9])','for(const topic of [1,2,3,4,5,6,7,8,9])');
    content=content.replace('>7 topics</span>','>9 topics</span>');
    content=content.replace('</head>','<style>.q-title{white-space:pre-wrap}.context-panel>div{white-space:pre-wrap}</style></head>');
    content=content.replace('</body>','<script src="shared-fix.js"></'+'script></body>');
    document.open();
    document.write(content);
    document.close();
  } catch(e) {
    fail(e.name==='AbortError'?'Loading timed out. Check your connection and refresh.':e.message);
    console.error('Economics MC startup failed:',e);
  } finally {clearTimeout(deadline)}
})();
</script></body></html>
