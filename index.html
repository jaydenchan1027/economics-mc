<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7ff" />
  <meta name="description" content="Offline Economics MC practice by topic, with instant marking and saved progress." />
  <title>ECON • MC Practice Bank</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="brand" class="brand plain" aria-label="Go home"><span class="brand-symbol">E<span class="symbol-mark">.</span></span><span class="brand-copy">ECON<span class="brand-sub">Small wins, big ideas</span></span></button>
    <span class="workspace-label">LEARN. PRACTICE. LEVEL UP.</span>
    <div class="top-actions"><span id="offlineStatus" class="offline-tag" role="status"><i></i> ONLINE ACCESS</span><button id="settingsBtn" class="icon-button" title="Progress settings" aria-label="Progress settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 3v8M15 13v8"/></svg><span>Settings</span></button></div>
  </header>
  <main id="main" class="main" tabindex="-1">
    <section class="empty-state" role="status">
      <h1 id="startupStatus">Loading the question bank…</h1>
      <p id="startupHint">Preparing your questions and saved progress.</p>
      <a class="secondary-btn" href="./">Retry loading</a>
      <noscript><p>Enable JavaScript in your browser to practice questions.</p></noscript>
    </section>
  </main>
  <footer class="app-footer"><p><strong>ECON</strong> · HKCEE & HKALE past-paper questions · Topics 1–9.</p><p>A little practice, every day. Your progress stays on this device.</p></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden />


<script>
// Keep a useful retry screen if a required script cannot reach the browser.
document.addEventListener('error', event => {
  if (!(event.target instanceof HTMLScriptElement) || !event.target.hasAttribute('data-required')) return;
  const status = document.getElementById('startupStatus');
  const hint = document.getElementById('startupHint');
  if (status) status.textContent = 'The question bank could not be loaded.';
  if (hint) hint.textContent = 'Check your connection and retry loading. Your saved progress stays on this device.';
}, true);
</script>
<script src="data.js" defer data-required></script>
<script src="app.js" defer data-required></script>
<script src="shared-fix.js" defer></script>
<script src="offline.js" defer></script>
</body>
</html>
